# Serves the single-page app and forwards API, admin and static requests to the Django container ("api").
# TLS is terminated by the proxy in front of this container, which must set X-Forwarded-Proto.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    client_max_body_size 16m;   # posters and avatars arrive as base64 inside JSON

    location ~ ^/(api|admin|accounts|static)/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $http_host;  # keeps the port, so absolute media URLs are right
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 60s;
    }

    # Uploaded media from the shared volume (unused when media is stored in an S3 bucket)
    location /media/ {
        alias /srv/media/;
        expires 7d;
        add_header Cache-Control "public";
    }

    # Hashed build assets never change
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
    }
}
