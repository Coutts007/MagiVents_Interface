# Serves the single-page app and forwards API, admin and static requests to the Django container ("api"), and AI
# assistant requests to the assistant container ("assistant", the same project served as ASGI).
# TLS is terminated by the proxy in front of this container, which must set X-Forwarded-Proto.

# Connections to the API are kept open and reused instead of opened for every request
upstream api_backend {
    server api:8000;
    keepalive 128;
    keepalive_timeout 60s;
}

# Short-lived cache for the public event list, event pages and app settings, shared by visitors who are not signed
# in (requests with an Authorization header always go to the API). The API says how long with Cache-Control.
proxy_cache_path /var/cache/nginx/api levels=1:2 keys_zone=api_cache:10m max_size=256m inactive=10m use_temp_path=off;

map $http_authorization $skip_api_cache {
    default 1;
    ""      0;
}

upstream assistant_backend {
    server assistant:8000;
    keepalive 128;
    keepalive_timeout 60s;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    client_max_body_size 16m;   # posters and avatars arrive as base64 inside JSON

    # The API gzips the cached event list itself; this covers the app's own files and other API responses
    gzip on;
    gzip_proxied any;
    gzip_comp_level 4;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types application/json application/javascript text/css image/svg+xml;

    # Answers stream as server-sent events; the server also sends X-Accel-Buffering: no
    location ^~ /api/assistant/ {
        proxy_pass http://assistant_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_buffering off;
        proxy_read_timeout 60s;
    }

    # Event list and one event. Only GET/HEAD are cached; other methods on the same paths pass through.
    # During a burst one request refreshes an entry while the rest are answered from the cache.
    location ~ ^/api/gatherings/([^/]+/)?$ {
        proxy_pass http://api_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 60s;

        proxy_cache api_cache;
        proxy_cache_key "$scheme$http_host$request_uri";
        proxy_cache_bypass $skip_api_cache;
        proxy_no_cache $skip_api_cache;
        proxy_cache_lock on;
        proxy_cache_lock_timeout 5s;
        proxy_cache_use_stale updating error timeout http_502 http_503 http_504;
        proxy_cache_background_update on;
        add_header X-Cache $upstream_cache_status always;
    }

    # App settings are the same for everyone, signed in or not
    location = /api/config/ {
        proxy_pass http://api_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_cache api_cache;
        proxy_cache_key "$scheme$http_host$request_uri";
        proxy_ignore_headers Vary;
        proxy_cache_lock on;
        proxy_cache_use_stale updating error timeout http_502 http_503 http_504;
        add_header X-Cache $upstream_cache_status always;
    }

    location ~ ^/(api|admin|accounts|static)/ {
        proxy_pass http://api_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;  # keeps the port, so absolute media URLs are right
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 60s;
    }

    # Uploaded media from the shared volume (unused when media is stored in an S3 bucket)
    location /media/ {
        alias /srv/media/;
        expires 7d;
        add_header Cache-Control "public";
    }

    # Hashed build assets never change
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
    }
}
