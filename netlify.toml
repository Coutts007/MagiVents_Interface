# Netlify build for the MagiVents single-page app. The API lives on Render: set VITE_API_BASE_URL
# (e.g. https://magivents-api.onrender.com/api) and VITE_GOOGLE_CLIENT_ID under Site configuration >
# Environment variables. They are baked in at build time, so trigger a new deploy after changing them.

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# Built files have content hashes in their names, so they can be cached for good
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Every other path (the staff console path, links opened from emails) loads the app, which reads the URL itself
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
